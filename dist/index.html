<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <title>Lumo · Bêta</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="fonts/fonts.css">

  <script defer src="core.js"></script>
